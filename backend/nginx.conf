server {
    listen 80;
    server_name api.vcom.officialshahalam.me;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Keep WebSocket connections alive for long-lived calls/chat
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Certbot will add SSL redirect and 443 block when you run:
    # sudo certbot --nginx -d api.vcom.officialshahalam.me
}
